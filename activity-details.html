<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praise | Activity details</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      const activityId = new URLSearchParams(window.location.search).get('id') || ''
      window.PRAISE_INITIAL_ROUTE = `#/activities/${encodeURIComponent(activityId)}`
    </script>
    <script src="https://unpkg.com/vue@3.5.44/dist/vue.global.prod.js"></script>
    <script src="app.js"></script>
  </body>
</html>
