<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praise | Booking confirmation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      const bookingReference = new URLSearchParams(window.location.search).get('reference') || ''
      window.PRAISE_INITIAL_ROUTE = `#/booking-confirmation/${encodeURIComponent(bookingReference)}`
    </script>
    <script src="https://unpkg.com/vue@3.5.44/dist/vue.global.prod.js"></script>
    <script src="app.js"></script>
  </body>
</html>
